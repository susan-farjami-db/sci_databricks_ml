# GitHub Actions workflow for SF Forecasting Pipeline (dev environment)
#
# Triggers:
#   - Manual dispatch (workflow_dispatch) from the GitHub Actions UI
#   - Scheduled daily at 06:00 UTC (approximates data-refresh trigger; adjust as needed)
#
# Prerequisites -- set these GitHub secrets:
#   DATABRICKS_HOST           
#   DATABRICKS_CLIENT_ID      Service Principal application (client) ID
#   DATABRICKS_CLIENT_SECRET  Service Principal secret

name: Deploy and Run SF Forecasting (dev)

on:
  workflow_dispatch:          # Manual trigger from GitHub Actions UI

  # Uncomment the schedule below to approximate a data-refresh trigger.
  # Adjust the cron expression to match your data refresh cadence.
  # schedule:
  #   - cron: "0 6 * * *"    # Daily at 06:00 UTC

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

jobs:
  deploy:
    name: Deploy bundle to dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sci-forecasting-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          databricks --version

      - name: Validate bundle
        run: databricks bundle validate --target dev

      - name: Deploy bundle
        run: databricks bundle deploy --target dev

  run_pipeline:
    name: Run forecasting pipeline
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sci-forecasting-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
          databricks --version

      - name: Run pipeline
        run: databricks bundle run --target dev sci_forecasting_pipeline
